# Ambiente dell'orchestratore wm-bench.
# Creazione:  mamba env create -f environment-bench-core.yml
# Dopo la creazione, dalla radice del repository:
#   pip install -e packages/bench-contracts && pip install -e .
#   pip check
#   pip freeze > requirements-bench-core.lock
#   conda list --explicit > conda-bench-core.lock
name: bench-core
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # toolchain per gli attacchi (formatter, linter, bundler)
  - nodejs=20
  - openjdk=17
  - maven=3.9
  - clang-tools=18        # clang-format, clang-tidy
  - cxx-compiler          # header C++ necessari a clang-tidy
  - git
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # deep learning (torch solo CUDA, come gli altri ambienti)
      - torch==2.4.1
      - transformers==4.46.3
      - accelerate==1.1.1
      - safetensors
      - tokenizers
      - sentencepiece
      # configurazione e SLURM
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - hydra-submitit-launcher==1.2.0
      - submitit
      - pydantic==2.9.2
      # dati
      - numpy==1.26.4
      - pandas==2.2.3
      - pyarrow==17.0.0
      - datasets==3.1.0
      - orjson
      - xxhash
      - filelock
      # statistica e ML
      - scipy==1.14.1
      - scikit-learn==1.5.2
      # valutazione (codebleu[all] porta tree-sitter e le grammatiche alle versioni compatibili)
      - evalplus==0.3.1
      - codebleu[all]==0.7.0
      - libcst==1.5.0
      # attacchi Python
      - black==24.10.0
      - ruff==0.7.4
      - python-minifier==2.11.3
      # report
      - matplotlib
      - tqdm
      # sviluppo e test
      - pytest
      - pytest-cov
      - pytest-timeout
      - hypothesis
      - mypy
      - pandas-stubs
      - types-PyYAML
      - pre-commit
