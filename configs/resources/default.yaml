# Regole della ResourcePolicy (SPEC §15.2, §16.3; cluster_info §4).
gpu_stages: [generate_baseline, generate_baseline_twin, imperceptibility]
gpu_methods_by_stage:
  watermark: {sweet: true, acw: false, stone: true, promptmark: true, mcgmark: true}
  # Rilevazione: SWEET usa il modello. STONE usa solo il tokenizer, ma la green list nasce da un
  # torch.Generator sul dispositivo dell'inserimento (CUDA): su CPU la permutazione è diversa
  # (audit di STONE §2). MCGMark: stessa ragione (audit di MCGMark §7).
  detect: {sweet: true, acw: false, stone: true, promptmark: false, mcgmark: true}
gpu_attack_groups: [T2, T3]    # T1 e T4 su CPU (defq), T2 e T3 su GPU (gpuq)
profiles:
  CPU: slurm_cpu
  GPU_NVIDIA: slurm_gpu
