# Configurazione statica del metodo (SPEC §16.2; cluster_info §1; PIPELINE_metodo.md di multimark).
# Metodo proposto dalla tesi (MultiMark, nome provvisorio), post-hoc, 24 bit, solo Python.
# In methods_catalog di configs/config.yaml dal P2 (adapter
# src/bench/methods/adapters/multimark.py), mai nella lista `methods` di default.
name: multimark
env: posthoc
family: post_hoc
submodule: third_party/multimark
patched_dir: build/patched/multimark
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
# Il pacchetto `multimark` è alla radice della copia: PYTHONPATH = build/patched/multimark.
patched_subdir: ""
supported_languages: [python]
# Configurazione di base (PIPELINE §0.1, §3.11). È anche MultimarkAdapter.PROFILE
# (test_posthoc_adapters lo verifica); una configurazione dell'HPO o dell'ablazione indica solo le
# chiavi che cambiano. message_bits = 24 e registry_seed li aggiunge l'adapter.
default_hparams:
  t: 2
  linking: function_channel
  mask: "on"
  canonical: kind
  names.variant: V2
  names.proposer: static            # neural da P3: fino ad allora gpu_for_embed = False
  names.include_params: false       # decisione C
  channels: extended
  names.module_level: true          # decisione O, provvisoria (v1.2.4): conferma a fine P2
  code.matrix: dmin4                # MD18
  names.single_letter: exclude      # decisione R in P5
  voting: simple
  channel_weights: null
