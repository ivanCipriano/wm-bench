# Configurazione statica del metodo (SPEC §16.2; cluster_info §1; PIPELINE_metodo.md di multimark).
# Metodo proposto dalla tesi (MultiMark, nome provvisorio), post-hoc, 24 bit, solo Python.
# Non ancora in methods_catalog di configs/config.yaml: si aggiunge in P2 con l'adapter
# (src/bench/methods/adapters/multimark.py), mai alla lista `methods` di default.
name: multimark
env: posthoc
family: post_hoc
submodule: third_party/multimark
patched_dir: build/patched/multimark
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
# Il pacchetto `multimark` è alla radice della copia: PYTHONPATH = build/patched/multimark.
patched_subdir: ""
supported_languages: [python]
# Profilo di base (PIPELINE §3.11) e validazione delle chiavi: in P2 con l'adapter.
default_hparams: {}
