# Configurazione statica del metodo (SPEC §16.2; cluster_info §1).
name: promptmark
env: promptmark
family: prompt
submodule: third_party/PromptMark
patched_dir: build/patched/promptmark
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
# Audit (docs/audit/promptmark.md): variante expI in src/ (import assoluti, src/watermarking aggiunta
# dallo shim), solo Python (paper §6). Default = valori del codice fino all'HPO (M8: griglia su tutti
# e tre, con stima del costo prima): 5 iterazioni, z = 2.12 (p < 0.017), green list dalla chiave.
patched_subdir: src
supported_languages: [python]
default_hparams: {iter_cap: 5, z_threshold: 2.12, green_size: null}
