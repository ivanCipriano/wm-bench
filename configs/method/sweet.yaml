# Configurazione statica del metodo (SPEC §16.2; cluster_info §1).
name: sweet
env: sweet
family: logit
submodule: third_party/sweet-watermark
patched_dir: build/patched/sweet
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
# Audit (docs/audit/sweet.md): sweet.py e watermark.py alla radice del repository; nessuna
# logica legata al linguaggio (§4).
patched_subdir: ""
supported_languages: [python, java, cpp, javascript]
# Default di main.py fino all'HPO (decisione dell'utente, audit §3). La griglia della M8 deve
# includere i valori del paper (gamma {0.1, 0.25, 0.5}, delta {0.5..4}, in particolare 0.25/3.0)
# e la soglia di entropia in {0.3, 0.6, 0.9, 1.2}, più questo default.
default_hparams: {gamma: 0.5, delta: 0.5, entropy_threshold: 0.5}
