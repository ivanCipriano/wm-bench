# Configurazione statica del metodo (SPEC §16.2; cluster_info §1; PIPELINE_metodo.md di multimark).
# Reimplementazione di Multi-Channel Spread-Spectrum (arXiv 2607.06009v1) come profilo della
# libreria multimark (PIPELINE §4), post-hoc, 24 bit, solo Python.
# In methods_catalog di configs/config.yaml dal P2 (adapter src/bench/methods/adapters/mcss.py),
# mai nella lista `methods` di default.
name: mcss
env: posthoc
family: post_hoc
submodule: third_party/multimark
patched_dir: build/patched/multimark      # stessa copia di multimark (patches/multimark/README.md)
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
patched_subdir: ""
supported_languages: [python]
# Profilo mcss (PIPELINE §3.11, colonna mcss; deviazioni in §4.2 e in docs/audit/mcss.md). È
# anche McssAdapter.PROFILE (test_posthoc_adapters lo verifica); una configurazione dell'HPO
# indica solo le chiavi che cambiano. message_bits = 24 e registry_seed li aggiunge l'adapter.
default_hparams:
  t: 2
  linking: positional
  mask: "off"
  canonical: paper
  names.variant: V1
  names.proposer: static            # non usato da V1
  names.include_params: true        # §4.2 punto 8
  channels: mcss8
  names.module_level: true
  code.matrix: random               # MD18
  names.single_letter: extend_except_loop   # §4.2 punto 9, esito v1.2.7 (MD19)
  names.bits_per_name: 1            # libreria a4e6972 (MD27)
  canonical.same_kind: "off"        # libreria a4e6972 (MD28)
  voting: simple
  channel_weights: null
