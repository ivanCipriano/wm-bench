# Configurazione statica del metodo (SPEC §16.2; cluster_info §1; PIPELINE_metodo.md di multimark).
# Reimplementazione di Multi-Channel Spread-Spectrum (arXiv 2607.06009v1) come profilo della
# libreria multimark (PIPELINE §4), post-hoc, 24 bit, solo Python.
# Non ancora in methods_catalog di configs/config.yaml: si aggiunge in P2 con l'adapter
# (src/bench/methods/adapters/mcss.py), mai alla lista `methods` di default.
name: mcss
env: posthoc
family: post_hoc
submodule: third_party/multimark
patched_dir: build/patched/multimark      # stessa copia di multimark (patches/multimark/README.md)
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
patched_subdir: ""
supported_languages: [python]
# Profilo mcss (PIPELINE §3.11, colonna mcss) e validazione delle chiavi: in P2 con l'adapter.
default_hparams: {}
