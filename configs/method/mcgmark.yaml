# Configurazione statica del metodo (SPEC §16.2; cluster_info §1).
name: mcgmark
env: mcgmark
family: logit
submodule: third_party/MCGMT
patched_dir: build/patched/mcgmark
worker_timeout_s: 18000        # 5 h: sotto il limite di 7 h delle partizioni GPU (cluster_info §1)
# Audit (docs/audit/mcgmark.md): codice in Watermark/ (import assoluti), solo Python (paper §4.4,
# D17), nessun iperparametro regolabile (bias = scarto dei logit, gamma 0.5 fisso con la patch 0001).
patched_subdir: Watermark
supported_languages: [python]
default_hparams: {}
