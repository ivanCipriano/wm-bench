# Griglia HPO di multimark (PIPELINE_metodo.md di multimark §6.4): la configurazione di base di
# configs/method/multimark.yaml ({}). Il solo fattore scelto fuori dall'HPO è il canale dei nomi
# (§6.4); la scelta aggiornerà questo punto (deviazione D4x, ADR-021).
#
# Ultimo giro su sviluppo prima del congelamento (P4+P5 ridotte, pipeline v1.3.11 e v1.3.14,
# decisioni dell'utente del 23 novembre 2026; scripts/run_p4_dev.sh, report scripts/report_p4.py),
# libreria b2b6c18 con il proponente statico (P3 chiusa: il proponente resta static). Le due
# configurazioni da congelare il 9 dicembre, B (prudente) e D (alta capacità), e cinque ablazioni
# rispetto a B, un fattore alla volta (§6.3): canale dei nomi V0 e V1 (names.bits_per_name torna a
# 1, che con V0 e V1 è l'unico valore ammesso), legame positional, maschera off, forme canoniche
# paper. mcss (1d3087c73439) è il default del suo metodo e si invia a parte (methods=[mcss], senza
# hpo.grid). Misurati su L1+L2 dev con gli attacchi S, T1.6 e T2.5; impercettibilità solo per le
# ablazioni (mcss, B e D: inserimento identico a ae63f16de28f, a8a296957377, b4cd11f13a07, già
# misurati; scripts/check_embed_identity.py lo verifica). Non sono una scelta: la fase tune non si
# lancia su multimark.
method: multimark
# config_hash con la libreria b2b6c18 (tests/unit/test_posthoc_config_hashes.py li ricontrolla).
# Giro P3, libreria b2b6c18 (scripts/run_p2_p3.sh; proponente neurale, non scelto): B neurale
# d54101565a0b, D neurale e80cde8924cb.
# Giro 4, libreria 0664817 (scripts/run_p2_round4.sh; punti in ROUND4_POINTS del test): B
# a8a296957377, B_sfx 042968dc17df, B_sfx_cl 317adaa840ee, B_sfx_clz a2d195001771, C 19e744a3b406,
# C_sfx 71d9d5e6160d, C_sfx_cl a8fadfc4757a, C_sfx_clz fb24f51f5d15, D b4cd11f13a07, D_sfx
# f4fb209f9226, D_sfx_cl f765c166de34, D_sfx_clz cb29e1d7b6b8.
# Giro di capacità, libreria a4e6972 (scripts/run_p2_round3.sh): base 3c1bd11758fc, single_letter
# 4937d9ddd78a, A 770f999adefb, B cb79b2fcb4e6, C cf7e4c9f106e, D 37400fdcd589. Secondo giro,
# libreria 475d4cc: base 59a04735824c, single_letter 94847adacd77, include_params acac071d50d5.
# Primo giro, libreria 488fb5a: base 194b0aa80f9f.
include:
  # B (prudente) = base + names.bits_per_name=2
  - {names.bits_per_name: 2}  # e52b040770df
  # D (alta capacità) = base + single_letter=extend_except_loop + same_kind=binding_order + bits_per_name=2 + include_params=true
  - {names.single_letter: extend_except_loop, canonical.same_kind: binding_order, names.bits_per_name: 2, names.include_params: true}  # 3fed1f1c1e24
  # ablazioni rispetto a B, un fattore alla volta (§6.3)
  - {names.variant: V0}  # ebeb5a0753cd
  - {names.variant: V1}  # 40e5e9455cea
  - {names.bits_per_name: 2, linking: positional}  # 271087ba99b6
  - {names.bits_per_name: 2, mask: "off"}  # 16de27361bad
  - {names.bits_per_name: 2, canonical: paper}  # 65eb9730301a
