# Griglia HPO di multimark (PIPELINE_metodo.md di multimark §6.4): la configurazione di base di
# configs/method/multimark.yaml ({}). Il solo fattore scelto fuori dall'HPO è il canale dei nomi
# (§6.4); la scelta aggiornerà questo punto (deviazione D4x, ADR-021).
#
# Giro di capacità su sviluppo (pipeline v1.3.3, 18 novembre 2026; scripts/run_p2_round3.sh):
# punti di §6.3 misurati su L1+L2 dev, senza attacchi e con gli attacchi dell'insieme S, per il
# criterio di scelta di v1.3.3 (sweep con hpo.grid=multimark, ADR-017 §5-§6: ognuno ha il suo
# config_hash, stampato da scripts/posthoc_config_hashes.py). Non sono una scelta: la fase tune
# non si lancia su multimark e la scelta diventa definitiva in P5, con l'impercettibilità.
# Il punto names.include_params=true da solo (secondo giro, libreria 475d4cc) non si rimisura.
method: multimark
# config_hash con la libreria a4e6972 (scripts/posthoc_config_hashes.py; il test
# tests/unit/test_posthoc_config_hashes.py li ricontrolla). Secondo giro, libreria 475d4cc: base
# 59a04735824c, single_letter 94847adacd77, include_params acac071d50d5 (prima delle chiavi
# names.bits_per_name e canonical.same_kind). Primo giro, libreria 488fb5a: base 194b0aa80f9f.
include:
  - {}                                          # 3c1bd11758fc
  - {names.single_letter: extend_except_loop}   # 4937d9ddd78a
  # A
  - {canonical.same_kind: binding_order}        # 770f999adefb
  # B
  - {names.bits_per_name: 2}                    # cb79b2fcb4e6
  # C
  - {names.single_letter: extend_except_loop, canonical.same_kind: binding_order, names.bits_per_name: 2}  # cf7e4c9f106e
  # D = C + include_params
  - {names.single_letter: extend_except_loop, canonical.same_kind: binding_order, names.bits_per_name: 2, names.include_params: true}  # 37400fdcd589
