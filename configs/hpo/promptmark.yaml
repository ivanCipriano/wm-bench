# Griglia HPO di PromptMark (Milestone 8; docs/hpo_grids.md, TODO 16, ADR-009).
# 27 configurazioni ricostruite da una traiettoria per dimensione della green list (5 iterazioni,
# soglia irraggiungibile), più il default del codice generato direttamente: 28 candidati.
method: promptmark
space:
  iter_cap: [1, 3, 5]
  z_threshold: [1.64, 2.12, 2.58]
  green_size: [8, 10, 12]
include:
  - {iter_cap: 5, z_threshold: 2.12, green_size: null}   # default del codice
replay:
  fixed: {iter_cap: 5, z_threshold: 1000000.0}   # η irraggiungibile (z = 10^6)
