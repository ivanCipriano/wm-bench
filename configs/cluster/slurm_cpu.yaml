# Profilo CPU: defq senza GPU (cluster_info §4). timeout 420 min = 7 h (80% di 9 h).
# Tarato in Milestone 4 sull'esecuzione di L1 (sacct, 4-5 ottobre 2026):
# - 16 CPU: job da 1-8 min, Python con 8 worker (metà, ADR-007), gli altri con 16;
# - 64 GB: uso misurato <= 2,7 GB (MaxRSS), ma il caso peggiore ammesso dai limiti per campione
#   è 8 worker Python x 8 GB = 64 GB; con meno memoria un campione al limite farebbe uccidere
#   l'intero job dal cgroup. Lo stesso profilo servirà ad attacchi e livelli più grandi.
name: slurm_cpu
kind: slurm
partition: defq
account: did_tesi_nlp_330
qos: did_tesi_nlp_330_defq_qos
gres: null
cpus_per_task: 16
mem_gb: 64
timeout_min: 420
provisional: false
# La sandbox usa Apptainer, disponibile solo dopo il module load (cluster_info §5).
setup:
  - module load apptainer/apptainer.module
